name: web CI

# The checks every DabAZ web project runs before a change reaches its default
# branch. The gate itself is the project's `pnpm check` script: this workflow
# only installs and runs it, so "what passes" is defined once, in package.json,
# next to the scripts it composes.
#
#   jobs:
#     ci:
#       uses: dabaz-official/.github/.github/workflows/web-ci.yml@main
on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to install.
        type: string
        default: "24"

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No version here: pnpm/action-setup reads `packageManager` from
      # package.json, so each repository pins the tool once, in the place a
      # human running the project also sees it.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # `cache: pnpm` caches the pnpm store keyed on pnpm-lock.yaml.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Without this, a caller that forgot the script fails with pnpm's
      # "Command check not found", which says nothing about what to do.
      - name: Verify the gate exists
        run: |
          node -e '
            const { scripts = {} } = require("./package.json");
            if (!scripts.check) {
              console.error("::error::package.json has no \"check\" script. Compose it from format:check, lint, typecheck, test, and build as in DabAgents rule 04.");
              process.exit(1);
            }
          '

      - name: Gate
        run: pnpm check
